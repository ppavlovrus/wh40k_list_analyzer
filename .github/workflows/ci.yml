name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      # The same commands a developer runs; progress.md keeps the project
      # honest about mypy strict staying green.
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy

  tests:
    name: Tests on ${{ matrix.python }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # pyproject promises >=3.12, so every version that promise covers is
        # run. An untested promise is the kind that breaks for someone else.
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Tests
        run: uv run pytest
