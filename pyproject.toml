[project]
name = "wh40k-analyzer"
version = "0.1.0"
description = "Warhammer 40k 11e army list analyzer: roster ingestion, canonical model, damage matrix, MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.7",
    "mcp>=1.28",
]

[project.scripts]
wh40k = "wh40k_analyzer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wh40k_analyzer"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                 # import sorting
    "UP",                # pyupgrade
    "B",                 # bugbear
    "SIM",               # simplify
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
