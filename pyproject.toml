[project]
name = "wh40k-analyzer"
version = "0.1.0"
description = "Warhammer 40k 11e army list analyzer: roster ingestion, canonical model, damage matrix, MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.7",
    "mcp>=1.28,<2",
]

[project.scripts]
wh40k = "wh40k_analyzer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wh40k_analyzer"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                 # import sorting
    "UP",                # pyupgrade
    "B",                 # bugbear
    "SIM",               # simplify
    "RUF",
]

# The project speaks Russian: Cyrillic next to Latin is intentional
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic next to Latin is intentional

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# Fixture data contains typographic apostrophes from the MFM paste (U+2019)
"tests/test_mfm_paste.py" = ["RUF001"]

[[tool.mypy.overrides]]
# FastMCP's @mcp.tool() decorator is untyped in the mcp package
module = "wh40k_analyzer.mcp_server"
disallow_untyped_decorators = false
